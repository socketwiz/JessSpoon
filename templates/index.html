{% extends "base.html" %}

{% block content %}
<div class="pt-10 bg-gray-900 sm:pt-16 lg:pt-8 lg:pb-14 lg:overflow-hidden">
  <div class="mx-auto max-w-7xl lg:px-8">
    <div class="lg:grid lg:grid-cols-2 lg:gap-8">
      <div class="mx-auto max-w-md px-4 sm:max-w-2xl sm:px-6 sm:text-center lg:px-0 lg:text-left lg:flex lg:items-center">
        <div class="lg:py-24">
          <h1 class="mt-4 text-4xl tracking-tight font-extrabold text-white sm:mt-5 sm:text-6xl lg:mt-6 xl:text-6xl">
            <span class="block">Jess Spoon</span>
          </h1>
          <p class="mt-3 text-base text-gray-300 sm:mt-5 sm:text-xl lg:text-lg xl:text-xl">Come with us on our journey as we combine our passion for music together with a mixture of blues and rock.</p>

          <div class="mt-6 flex justify-between">
            <a class="text-white text-6xl hover:text-gray-300" href="https://twitter.com/spoon_jess">
              <i class="fa-brands fa-square-x-twitter"></i>
            </a>
            <a class="text-white text-6xl hover:text-gray-300" href="https://www.facebook.com/jessspoonsound/">
              <i class="fa-brands fa-square-facebook"></i>
            </a>
            <a class="text-white text-6xl hover:text-gray-300" href="https://www.instagram.com/jess_spoon_/">
              <i class="fa-brands fa-square-instagram"></i>
            </a>
            <a class="text-white text-6xl hover:text-gray-300" href="https://www.youtube.com/channel/UC8w1V7z1ZyZXMs3lRYcJQrg">
              <i class="fa-brands fa-square-youtube"></i>
            </a>
          </div>
        </div>
      </div>
      <div class="mt-12 -mb-16 sm:-mb-48 lg:m-0 lg:relative">
        <div class="mx-auto max-w-md px-4 sm:max-w-2xl sm:px-6 lg:max-w-none lg:px-0">
          <img class="w-full lg:absolute lg:inset-y-0 lg:left-0 lg:h-full lg:w-auto lg:max-w-none" src="/images/jessspoon-bridge.png" alt="JessSpoon band on a bridge" />
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
